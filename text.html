</style></head><body><header><nav><div class="brand"><a href="index.html" style="color:inherit;text-decoration:none">作品集</a> / 文字</div></nav><div class="hero"><h1>往暮色深处</h1></div></header><main class="shell"><section class="intro"><div><h2>作品目录</h2><p>按体例浏览，也可以打开任意篇目进入完整阅读。</p></div><div class="stats"><strong id="count">0</strong>篇文字 · 笔名：风寻</div></section><div class="filters"><button class="filter active" data-type="全部">全部</button><button class="filter" data-type="诗歌">诗歌</button><button class="filter" data-type="散文">散文</button><button class="filter" data-type="小说">小说</button><button class="filter" data-type="同人小说">同人小说</button><a class="filter" href="scripts/" style="text-decoration:none">剧本</a></div><section id="grid" class="grid"></section></main><div class="modal" id="modal"><article class="reader"><button class="close" id="close">×</button><div class="tag" id="rType"></div><h2 id="rTitle"></h2><div class="meta" id="rMeta"></div><div id="rBody"></div></article></div><script>const works=[{"id":"omg3","title":"OMG3","type":"剧本","series":"剧本","excerpt":"信仰、背叛与自我追寻。Kanjira在“牧人”的引导下，为自己的名誉与权利展开抗争。","url":"scripts/omg3.html"},{"id": "w0", "title": "（铁虫）跨宇宙快递", "type": "同人小说", "series": "他们的平行世界", "excerpt": "（铁虫）跨宇宙快递 Summary：BND虫在被一枪崩了后穿到了另一个宇刚在德国机场的小虫身上蜘蛛代打过后发现自己占据了14岁彼得的身体。", "body": "<p>（铁虫）跨宇宙快递</p><p>Summary：BND虫在被一枪崩了后穿到了另一个宇刚在德国机场的小虫身上蜘蛛代打过后发现自己占据了14岁彼得的身体。</p><p>蜘蛛侠决定改变这个宇宙的命运。</p><p>而在拯救的过程中，他欣喜地发现，或许找到了带回属于他的斯塔克先生的方法。</p><p></p><p>01</p><p>“underoos！”</p><p>恢复意识时，彼得好像听到了斯塔克先生的声音，睡衣宝宝，是在叫他吗？</p><p>意识还没完全清醒，但是身体的肌肉记忆已经让他射出蛛丝，缠住了美国队长的盾牌并以一个完美的姿势落地。彼得后知后觉地意识到，好像有哪里不对。</p><p>他重新观察四周，机场，美国队长，冬兵，黑寡妇，复联的大家……还有，钢铁侠，斯塔克先生。等等，斯塔克先生？</p><p>彼得晃了晃脑袋，发现自己居然回到了机场大战，他的十四岁。这真的不是什么幻觉吗？还是死前的走马灯？好吧，走马灯从这里开始也不错，至少能再次见到斯塔克先生。</p><p>不过他好像还能控制自己的身体，或许是梦？既然这样，那他会比十四岁时更加努力地帮助斯塔克先生，比如——先把盾牌上藏着的蚁人甩出去。</p><p>“干得漂亮，孩子。”彼得听见斯塔克先生夸赞他，他转向托尼，试图说些什么，但不知为何语气有些古怪：“谢谢！斯塔克先生，新战衣很酷！还有队长，我是你的超级粉丝！”十四岁时他应该说的是这些吧？彼得没注意到他的话语已经隐隐带有哭腔，这让他的嗓音显得更加尖细。</p><p>“嘿！kid，我知道成功夺走队长的盾牌让你很激动，但也没必要激动到快要哭出来？”托尼总觉得哪里不太对劲，从过往战斗记录看，蜘蛛侠不应该表现得更加活泼一点吗？</p><p>“哦斯塔克先生！抱歉，我只是…只是太激动了！对！毕竟那可是队长啊。”彼得迅速调整好状态，无论是梦还是走马灯还是恶作剧幻境，或者他真的回到了过去，无论怎样，能重新和斯塔克先生说上话，真是太棒了。</p><p>不过，如果他能改变些什么的话，他不希望复仇者联盟再次分裂了，就算是梦也值得一个完美结局。</p><p>在终局之战后的那些年，彼得重新调查了托尼的过往，还有复仇者们的往事，有些事是公开的，也有一些被各方隐瞒，在很长一段时间里，寻找真相和托尼留下的那些鲜为人知的痕迹，是彼得重要的娱乐活动之一。</p><p>因此，他后来了解到了一部分内战的真相，当然不是什么美国队长疯了——当然他还是愿意相信斯塔克先生，但索科维亚协议也从来不是真正的核心，可惜不管怎样，复仇者联盟的确事实意义上被分裂了。</p><p>他也无数次地想，如果联盟没有分裂，如果他们能团结到更多的力量，如果他们做出更多的准备，是不是就可以阻止灭霸打出第一个响指，是不是半个宇宙就不会烁灭，是不是……斯塔克先生就可以继续活下来？彼得无法控制自己的幻想，幻想无数种可能，假如他们能够成功在灭霸再次拿到手套前将宝石送回去，假如他再厉害一点能够在斯塔克先生之前打出那个响指，假如在泰坦星上时还有其他的同伴在身边，假如假如假如，一切都无法挽回。</p><p>而他居然真的有机会回到还可以挽回一切的起点。</p><p>“嘿朋友们！或许我们应该坐下来好好谈谈？打架可不是解决问题的好办法啊。”彼得试图大声呼吁。</p><p>但是晚了，大家已经开打了。</p><p>托尼抽空嘱咐了几句：“抱歉了和平主义宝宝，现在我们可没法坐下来谈了，注意安全！”</p><p>呼呼，看来还是要先打一架，没关系，彼得最擅长的就是战斗了。</p><p>他成功把猎鹰和冬兵捆了起来，又打倒了变大的蚁人，拖着他们奔向和美国队长难舍难分的托尼。</p><p>“停下！停下！斯塔克先生！队长！斯塔克先生，你看到的东西是一个叫泽莫的心理医生伪造的！还有—还有——巴恩斯先生是被九头蛇控制了，那不是他的本意。”彼得射出蛛丝暂停了二人的战斗，带着两个“伴手礼”，“你们真的需要好好聊聊。”他把山姆和巴基放下，对巴基说：“虽然是九头蛇控制了你，这一切都并非出自你的本意…但我想，巴恩斯先生，你应该对斯塔克先生道歉的……我是说，毕竟，毕竟，是冬日战士做了这些。对不起巴恩斯先生，我知道你是无辜的，可、可是斯塔克先生也是无辜的。”</p><p>复仇者们都停下了动作。托尼回头震惊地望着彼得：“你说什么？孩子？你怎么知道——你从哪里知道这些？”</p><p>史蒂夫也严肃地看向彼得。还有被蛛丝缠着的巴基。</p><p>“托尼，我们确实需要聊聊。”</p><p>“我不知道我们还有什么好说的——”托尼又换回了习惯的嘲讽语气，“不过，看在这个孩子的份上，你得到了和我和平对话的一次机会，最后一次，队长，说吧，你们知道的一切。”</p><p>02</p><p>一切看上去都很顺利，希望他迈出了成功的第一步，彼得放松下来，感觉头有些晕乎乎的。</p><p>“嘿…！哥们，我承认你战斗的姿态非常帅气，还知道一些我不知道的事情。这无疑帮了斯塔克先生大忙了！但是，但是……你是谁呀？把我的身体还给我吧？”彼得忽然听到脑海中有个熟悉的声音大呼小叫，是幻觉？</p><p>“嘿！就是你，你这个冒牌蜘蛛侠！”</p><p>看来不是幻觉，彼得脑子里真的有一个声音。下一瞬，那个声音的主人重新掌控了身体，彼得被踢到意识中。</p><p>“呼——重新掌控身体的感觉可真不错，虽然不知道为什么我会有这样的经历——”声音的主人——显然也是这个身体真正的主人——活动了一下手脚，“你好！I’m Peter，Peter Parker，spiderman！你是谁？呃，虽然我猜你也是一个蜘蛛侠，你怎么会到我的身体里？不得不说老兄，你的战斗实在很酷！”</p><p>哇哦，看来这不是梦，而是过去了。听年轻的自己叽叽喳喳，真是奇妙的感觉。</p><p>“哦！你好peter，呃，我也是彼得帕克，蜘蛛侠，21岁的那种。”彼得尝试在意识中回复年轻的蜘蛛侠。</p><p>“你也是彼得！酷！所以，你是未来的我？”小彼得的眼睛一下子睁大了，那双漂亮的眼中闪烁着兴奋的光芒，毕竟不是谁都有这个机会可以和未来的自己对话，甚至还住在一个身体里，“好吧，那我原谅你不经过我同意就使用我的身体了。不过你是怎么跨越时间来到这里的？）”</p><p>“呃，我想也许是的。以及我也不知道我是怎么来到这里的，我被巴雷特击中，意识清醒后就在这里，接管了你的身体……然后发现正是内战的时候…我经历过，所以有些经验…我后来知道了斯塔克先生和队长对立的原因……”彼得喋喋不休地想要解释一切，但很快被震惊到小彼得打断：“wait！wait！什么叫你被巴雷特击中了！——哦不不不，未来的我的日子这么刺激吗？！生抗巴雷特？这已经完全超越了人类的范畴！就算是蜘蛛侠也不行吧！”</p><p>小彼得大叫起来，终于吸引了正在和史蒂夫交涉的托尼的目光。</p><p>“kid，你在大喊什么呢？什么巴雷特？什么人类的？”托尼揉了揉太阳穴，冬兵、泽莫、队长、国会，还有一只叽叽喳喳的蜘蛛宝宝——可喜可贺的是这只蜘蛛宝宝终于变得符合他的印象了，他已经确认彼得说的基本是真的了，但这一切还是让他头痛。</p><p>“斯塔克先生！你们聊得怎么样了？”小彼得奔向他，“我遇到了很神奇的事情！”</p><p>复仇者们都望了过来，这个新人给他们带来了很多惊喜，在之前的战斗中，蜘蛛侠表现得非常成熟，还带来了意料之外的惊喜，但现在似乎又变得不那么稳重了。</p><p>看来蜘蛛侠确实还是个孩子。</p><p>“我的脑子里住着未来的蜘蛛侠！刚刚就是他接管了我的身体——呃，不得不说，未来的我的战斗意识确实比我好，一点点——当然我会继续成长的！”小彼得手舞足蹈，“哦不过更重要的是！他说他是被巴雷特一枪击中后来到这里的，斯塔克先生，能给彼得做一下检查吗——我是说大的那个，我有些担心。毕竟那可是巴雷特，哇哦，就算是蜘蛛精也扛不住反器材枪械吧？呃，不过该怎么给一段意识？灵魂？做检查呢？”</p><p>“什么？”托尼很震惊。</p><p>“什么？！”显然复仇者们都很震惊。</p><p>“事实上，我感觉很好。”彼得在脑海里弱弱地反驳小彼得。</p><p>03</p><p>小彼得慷慨地把身体暂时让给了彼得，让他能够自由地讲述他的故事。</p><p>不过彼得的思绪也是乱七八糟，他简略地讲述了他认为目前最重要的事情——内战、分裂、法师、宝石、泰坦星、烁灭，还有长得像紫薯的灭霸，和他们的两次战争。彼得没有说出钢铁侠和黑寡妇的牺牲。</p><p>听起来地球的未来岌岌可危，但托尼现在最关心的不是这个。</p><p>“不，孩子。我现在更想知道的是你，你身上发生了什么？”</p><p>“呃，斯塔克先生，我，我很好。这不重要，灭霸要来了，大家。”彼得有些茫然，重要的不是灭霸吗？</p><p>“巴雷特听起来可一点都不好。”托尼不敢苟同，但这只成熟的大蜘蛛看起来一点都不在乎自己的身体，但他暂时也没时间刨根究底了。</p><p>“好吧，孩子，我和你的偶像现在着急去西伯利亚找该死的泽莫和九头蛇算账。虽然这在计划外，但，不如你就和我们一起去吧？在飞机上，你可以详细讲讲你的事情，详细讲讲，关于那什么紫薯，和你自己。</p><p>说实话，我现在可不放心让你一个人呆着，谁知道会不会从什么地方来一发巴雷特，来自未来的蜘蛛侠。”</p><p>“还有，超级英雄们，我们就地解散？去履行复仇者的职责，准备应付新的宇宙级危机吧。或许我们还需要想办法把那个绿色的大块头和索尔找回来，还有那该死的协议。哦天，事情可真不少，我又觉得头痛了。”</p><p>04</p><p>前往西伯利亚的路上。</p><p>“所以，我们未来是什么关系？我做了什么？你很亲近我。”托尼若有所思，他对蜘蛛侠无疑是抱有好感的，毕竟蜘蛛侠是天生就具有一切英雄的品质，同时他还是一个愿意为了钢铁侠去打美国队长的崇拜者、一个能用破烂自制蛛网液的小天才；但是彼得表现出来的对他的信赖与眷恋似乎已经超出了他曾预想的导师与门徒之类的关系。</p><p>“您拯救了世界，拯救了我，斯塔克先生。”</p><p>“这个回答只能解释一部分你的表现。”托尼不以为意。</p><p>“好吧，那么，希望您别太惊讶。我们的关系，大概是我会是您一部分的遗产继承人，当然，您也会是我的，这样的关系吧。”彼得用了一个将来时。</p><p>“什么？”这其实是史蒂夫发出的疑问，“所以你被托尼收养了吗？”</p><p>“这是一个秘密，队长。”彼得当然没有被托尼收养，他们还没来得及有任何法律上的关系，但这不妨碍彼得帕克在托尼斯塔克的遗嘱里占据重要的一席之地。</p><p>巴基若有所思地看着彼得。</p><p>而托尼的关注点已经转向了另一个地方：“所以，我死了？”他没有被彼得话语中的时态骗到。也并不对他们能互相成为遗产继承人的关系感到震惊，托尼又悄悄打量了彼得那张稚嫩但美丽的脸庞，和他高贵的心灵。</p><p>史蒂夫担忧地看向托尼。</p><p>“当然不——！”彼得想要否认，但看着托尼那双似乎已经洞穿一切的焦糖色眸子，又泄了气，“好吧，是的。您拯救了世界，然后牺牲了。”</p><p>“嗯哼？”</p><p>“还记得我之前提到的和灭霸的两次战争吗？班纳教授打了响指后带回了烁灭的半个宇宙，但灭霸又来了，第二次战争时，灭霸再次拿到了无限手套，他想要整个宇宙消失然后创造一个新的世界；您阻止了他，您打了那个响指，然后——作为代价，您、您牺牲了自己的生命，我感受到您的心脏逐渐停止跳动，连反应堆也熄灭了！甚至、甚至，无限宝石带走了您的一切存在痕迹，我们连您的尸体都没法带回去！而我只能眼睁睁看着这一切！”彼得的情绪难得很激动，托尼的牺牲一直是他不想回顾的噩梦，他又想到托尼拉着他的手覆在反应堆上，他感受到那颗心脏渐渐停止跳动，下一秒托尼就消失了，无限宝石连一具完整的身体也不愿意留给他。</p><p>“哇哦，听上去像是我会做出的选择。”看着激动的彼得，托尼只能挤出一个干巴巴地笑，他的离开一定给彼得留下了不可磨灭的创伤。他迟疑地揽过彼得，拍了拍他的肩膀。</p><p>“……斯塔克先生……”被搂着的男孩抬头泪眼汪汪的看着他，情绪过于激动的彼得被按回了意识里冷静，小彼得重新掌控了身体，虽然其实他也很激动，没有一个彼得愿意接受托尼死亡的结果。</p><p>这双湿漉漉的棕色眼睛让托尼只能保证：“好吧…孩子，我目前显然没有送死的计划。别担心。”</p><p>哦，老天，什么时候我开始兼职哄孩子了。</p><p>他们旁若无人地温情脉脉起来。</p><p>但显然这里还有其他人。</p><p>史蒂夫和巴基对视一眼，他们也有要说的话，与要解决的事情。</p><p>巴基深吸了一口气，拉着史蒂夫走到托尼面前。</p><p>“对不起，斯塔克。”巴基郑重道歉，“无论如何，是我杀死了你的父母。”</p><p>“……”</p><p>托尼难得有些不知道说些什么，他感到五味杂陈，理性占据上风后，他当然明白罪魁祸首是九头蛇，而冬日战士只是武器，巴恩斯本人无疑是无辜的，这甚至违反他的意志。</p><p>但从感性上讲，没有人能够在面对杀死父母的家伙时无动于衷，哪怕那是一把真正的、普通的刀，托尼也会让持刀的人付出代价，然后忍不住把刀毁掉。</p><p>但巴恩斯是一个活生生的人。</p><p>小彼得轻轻抵着托尼的战甲，希望给他的斯塔克先生一点力量，彼得也在意识里纠结又担忧地看着一切。</p><p>托尼深深吸了口气，他到底不会真的迁怒无辜。</p><p>“我不会原谅冬日战士和九头蛇。”</p><p>史蒂夫和巴基紧张起来。</p><p>“但，我不能、也不会责怪你，巴恩斯……巴基。”</p><p>紧张的两人显然松了口气。</p><p>悄悄观望的两只小蜘蛛也松了口气。</p><p>“但队长，你知道对吗？你瞒着我，你不信任我，我不会原谅你的隐瞒，我决定还是要和你打一架。”</p><p>“我很抱歉，托尼，对不起。我们随时可以切磋。”为了巴基，他选择了隐瞒托尼，但是他忘了托尼也是无辜的，有权知道真相，而他也应该更相信他的朋友。</p><p>他们抵达了西伯利亚，泽莫显然没有想到美国队长和钢铁侠居然没有闹翻，甚至还握手言和了，于是一切都解决地很顺利，包括那几个冬日战士。</p><p>但索科维亚协议依旧亟待处理。</p><p>史蒂夫最终还是决定和巴基先离开，托尼不敢置信地看着他们：“你们知道我可以帮忙解决国会的问题吧，就算你们大摇大摆回纽约？”</p><p>“我知道，托尼，谢谢你。但我们不能这样麻烦你。”史蒂夫犹豫，“而且，我想找办法解决巴基的洗脑问题。”</p><p>沉默的冬日战士在一旁点头。</p><p>彼得默默举手：“我推荐一个地方，瓦坎达怎么样？”</p><p>托尼揉了揉额头，承诺：“好吧，队长，我会尽快解决协议的事情……显然我们有更重要的危机要面对。战机留给你们，我让哈皮派一辆新的来。别跑太远，随时联系。”</p><p>“我们会的，托尼，解决了巴基的问题后我们就会回基地。随时联系。”</p><p>05</p><p>美国队长和冬日战士离开了。</p><p>托尼和彼得也很快等到了他们的交通工具。</p><p>回程的路上，他们没有继续讨论那些关于未来的严肃话题，托尼很关心第一次参加复仇者之间的“实习活动”的小蜘蛛——虽然中途被顶号代打了，但小彼得还是清楚地感受到了一切。</p><p>虽然没打上架，但是见到未来的自己明显更酷！</p><p>小彼得表示一切都好，表示自己想要多参加一些“实习”。</p><p>托尼冷酷地拒绝了他。</p><p>小彼得对此很不满，选择在意识里和大彼得交流，他要孤立可恶的大人！</p><p>但是彼得想要多看看斯塔克先生，于是小彼得只能睁着那双大眼睛盯着托尼，却不对托尼说一句话。</p><p>托尼对此感到莫名其妙，青少年的心思真是难测。但今天发生的一切让他心力交瘁，父母死亡的真相、近在咫尺的危机、来自未来的访客……有些在他意料之中，但大部分出乎意料，托尼需要安静地思考这些问题，也就不计较孩子的小脾气了。</p><p>他们回到了纽约。</p><p>回到熟悉的领地后，托尼终于有心思来面对这个未来访客的小问题。</p><p>“那么，彼得，我们要研究怎么送你回去？也许一个时空穿梭机器？——现在的我可还没开始涉及这个领域呢孩子，这需要不少时间。不过，我希望你别那么着急回去？你看上去需要一些休息，哦，还需要一些斯塔克能量。”</p><p>小彼得也表示他不介意未来的自己多住一段时间，他们已经在飞机上交流了不少信息，也发现他们都可以自由地掌控身体，但彼得表示他应该只在需要的时候出来。小彼得非常好奇大彼得的一切——虽然那可能也是他的一切，如果能教他一点新的战斗技巧就更好了。</p><p>“唔，或者找你口中那个神奇博士施展一个神秘小咒语？严格来说你是一个灵魂体，或者一段意识，这种东西果然还是要找专业人员吧，法师，或者道士什么的。”</p><p>“不不不斯塔克先生！至少…至少别找道士吧，我是说。而且，涉及意识的时空穿梭什么的，确实是…确实是一个难题，不能急于一时；虽然其实我对时间机器有一些研究，但那是针对实体的。所以，我们应该需要一点时间。”彼得连连摆手，他的眼睛一直近乎贪婪地注视着托尼的脸庞，他如何也看不够，那双蜜色的眼眸，那些彰显着岁月痕迹的细纹，虽然眼下仍有疤痕和乌青，却依旧鲜活的脸庞，而不是他最后见到的失去血色的、濒死的那张。</p><p>事实上，彼得确实没有那么希望快点回去，虽然这是小彼得的身体，虽然未来的纽约也需要蜘蛛侠，虽然琴和弗兰克或许还担忧着他的情况，以及不知道他的身体是否还活着什么的——等等，如果身体死了那他回去还能活下来吗，对此彼得决定更相信他的蜘蛛基因一点。</p><p>虽然，虽然…他知道这完全是自私的，无论是对过去的世界还是对未来的世界可他实在是太想念斯塔克先生了，还有梅，还有仍然记得他的内德和MJ，还有复仇者的大家，以及一切他曾拥有却又失去的一切。他想要再多看看他们鲜活的熟悉的脸庞，多和他们进行一些交流，多增加属于他们的回忆，这样，在再次失去他们后，他就可以生出更多的勇气来面对蜘蛛侠之外的、属于彼得帕克糟糕生活的一地鸡毛。</p><p>我只是还需要一些时间。彼得告诉自己，我一定会尽快想办法回去的。</p><p>“好吧，天才们，那我们先不着急。你该回家了，蜘蛛宝宝，别让你的漂亮婶婶担心。当然，你——包括大蜘蛛和小蜘蛛，可以随时来找我。走吧，我让哈皮送你。”</p><p>托尼和彼得告别。</p><p>然后托尼不知道为什么也上了车。</p><p>哈皮无语地看着他的老板。</p><p>熟悉的场景，熟悉的动作。</p><p>“呃，事实上，我只是帮你开个车门，我想我们还没到这个程度呢？”显然，小彼得一样以为这是一个拥抱。</p><p>“不，我是大的那个，我们已经到这个程度了，斯塔克先生。”彼得只是紧紧地拥抱托尼——显然这是一个“需要的时候”，小彼得也完全认可这句话，拜托，那可是他的偶像——他保证钢铁侠排在美国队长前面！</p><p>06</p><p>梅很高兴看到彼得完好无损地回家，他们交换了一个温暖的怀抱。彼得感受着久违的温暖，但他不准备告诉梅他来自未来，是他的错误导致了梅的死亡，能够再次见到她、感受她，就已经是他曾奢望的一切了。</p><p>小彼得倒是想跟梅说些什么，但彼得阻止了他。</p><p>小彼得纠结地鼓了鼓脸颊，未来的自己怎么变成回避型了，他决定把所有的核桃面包都让大彼得吃。</p><p>他们回到了房间。</p><p>“呼——不得不说，这几天发生的一切都太刺激了！”一关上房门，小彼得就忍不住惊呼起来，他相信没有其他任何人会有与他一样的体验！不过他还有很多好奇的事情。</p><p>“为什么不告诉梅，这里还有一个来自未来的彼得帕克？我想她也会很惊喜的。”</p><p>“我只是……她因我而死。我爱她。”彼得坦白，“当然，我想你不会再经历这一切了。”</p><p>小彼得的眉毛都要皱成一团了，未来自己居然混的这么惨？</p><p>“听起来你还隐瞒了不少事情。”</p><p>“你想知道的话，我会慢慢告诉你的。”彼得看起来不是很想继续这个话题，“但那确实，不是什么好的回忆。我能给你的忠告是，小心鱼缸头。”</p><p>小彼得识趣地换了个话题，虽然他还是好奇鱼缸头是什么。</p><p>“所以，未来我和斯塔克先生会变得非常亲密吗！”</p><p>“呃……大概会的。”彼得的语气听起来有些纠结，“我爱他，我在十六岁时向他表白了，事实上。”他觉得和十四岁的自己说这些非常奇怪，但在遗忘咒后，他再也没有可以分享他无处安放的感情的对象，内德和MJ曾经清楚他的少年心事，但这一切都随着咒语消失了。</p><p>“哇哦！哇哦！”小彼得惊叹，但他更关注的是，“那斯塔克先生答应了吗！”</p><p>“嘿……你怎么不先问问为什么会向斯塔克先生表白……”</p><p>“你难道不知道十四岁的你在想什么吗？嘿那可是斯塔克先生！十四岁的彼得难道就不仰慕钢铁侠了吗？”小彼得不以为意，他觉得这简直太正常了！“快点回答我的问题啦。”</p><p>“事实上，当然——没有。”彼得很无奈。</p><p>“欸——”</p><p>“斯塔克先生当然不会答应我…！孩子，你还小。他是这么说的。”彼得摊手，“我就不应该听内德和MJ的教唆去表白，斯塔克先生怎么会答应一个未成年的告白嘛。”</p><p>“但这听起来只是一个借口，不算完全拒绝你嘛。”小彼得一针见血地指出，“斯塔克先生只是觉得年纪不合适，可没说不喜欢你。我们还有机会！”</p><p>“是啊，所以我本来准备十七岁的时候再表白一次，但，我没等到这个机会。所以我也感谢内德和MJ，如果没有他们，或许我连一次向斯塔克先生表明心意的机会都没有。”一切都发生得太快了，彼得没有机会再得到一个回应，他最后拥有的只是一个在硝烟中的拥抱，和一个落在颈侧的吻。</p><p>“不过现在，你——我们，我们还有机会。”</p><p>“没错！为了我的爱情！我一定要阻止你说的那些糟糕的事情发生！该死的紫薯精，我已经预订了他的落幕。”小彼得斗志满满。彼得反驳那还不是你的爱情，至少到成年后再说吧。</p><p>没错，一切都还未发生，他们可以改写结局。</p><p>虽然彼得还没搞明白为什么上天愿意给他一个重返过去的机会。难道和他偷偷藏下的时间机器有关？</p><p>“下一个问题！蜘蛛侠先生，对于你是怎么回到过去的，你有什么头绪吗？”小彼得在宣讲完他拳打脚踢打败灭霸拯救钢铁侠的豪言壮语后，又产生了新的好奇心。</p><p>“好吧，我正想说这个。事实上，在终局之战后，我偷偷藏下了时间机器的原型机……但我只是保存它，好吧，还进行了一点点研究，但绝对没有启动过它。”彼得迟疑，“额，应该没有？总不能是我在蜘蛛基因再次分化时意识不清醒地碰到了它吧——哦这麻烦的蜘蛛基因！但这不应该把我的身体送过来吗？”</p><p>彼得觉得真相与时间机器无关。</p><p>05</p><p>美国队长和冬日战士离开了。</p><p>托尼和彼得也很快等到了他们的交通工具。</p><p>回程的路上，他们没有继续讨论那些关于未来的严肃话题，托尼很关心第一次参加复仇者之间的“实习活动”的小蜘蛛——虽然中途被顶号代打了，但小彼得还是清楚地感受到了一切。</p><p>虽然没打上架，但是见到未来的自己明显更酷！</p><p>小彼得表示一切都好，表示自己想要多参加一些“实习”。</p><p>托尼冷酷地拒绝了他。</p><p>小彼得对此很不满，选择在意识里和大彼得交流，他要孤立可恶的大人！</p><p>但是彼得想要多看看斯塔克先生，于是小彼得只能睁着那双大眼睛盯着托尼，却不对托尼说一句话。</p><p>托尼对此感到莫名其妙，青少年的心思真是难测。但今天发生的一切让他心力交瘁，父母死亡的真相、近在咫尺的危机、来自未来的访客……有些在他意料之中，但大部分出乎意料，托尼需要安静地思考这些问题，也就不计较孩子的小脾气了。</p><p>他们回到了纽约。</p><p>回到熟悉的领地后，托尼终于有心思来面对这个未来访客的小问题。</p><p>“那么，彼得，我们要研究怎么送你回去？也许一个时空穿梭机器？——现在的我可还没开始涉及这个领域呢孩子，这需要不少时间。不过，我希望你别那么着急回去？你看上去需要一些休息，哦，还需要一些斯塔克能量。”</p><p>小彼得也表示他不介意未来的自己多住一段时间，他们已经在飞机上交流了不少信息，也发现他们都可以自由地掌控身体，但彼得表示他应该只在需要的时候出来。小彼得非常好奇大彼得的一切——虽然那可能也是他的一切，如果能教他一点新的战斗技巧就更好了。</p><p>“唔，或者找你口中那个神奇博士施展一个神秘小咒语？严格来说你是一个灵魂体，或者一段意识，这种东西果然还是要找专业人员吧，法师，或者道士什么的。”</p><p>“不不不斯塔克先生！至少…至少别找道士吧，我是说。而且，涉及意识的时空穿梭什么的，确实是…确实是一个难题，不能急于一时；虽然其实我对时间机器有一些研究，但那是针对实体的。所以，我们应该需要一点时间。”彼得连连摆手，他的眼睛一直近乎贪婪地注视着托尼的脸庞，他如何也看不够，那双蜜色的眼眸，那些彰显着岁月痕迹的细纹，虽然眼下仍有疤痕和乌青，却依旧鲜活的脸庞，而不是他最后见到的失去血色的、濒死的那张。</p><p>事实上，彼得确实没有那么希望快点回去，虽然这是小彼得的身体，虽然未来的纽约也需要蜘蛛侠，虽然琴和弗兰克或许还担忧着他的情况，以及不知道他的身体是否还活着什么的——等等，如果身体死了那他回去还能活下来吗，对此彼得决定更相信他的蜘蛛基因一点。</p><p>虽然，虽然…他知道这完全是自私的，无论是对过去的世界还是对未来的世界可他实在是太想念斯塔克先生了，还有梅，还有仍然记得他的内德和MJ，还有复仇者的大家，以及一切他曾拥有却又失去的一切。他想要再多看看他们鲜活的熟悉的脸庞，多和他们进行一些交流，多增加属于他们的回 p>彼得觉得真相与时间机器无关。</p><p>08</p><p>彼得开始频繁出入托尼的实验室，他们都很忙碌。托尼不断升级着复仇者们的装备，继续迭代自己的战甲和给小彼得的新战衣，在“日常”的工作外，托尼还尝试捣鼓一台“穿越”机器。</p><p>彼得们则忙着改良绝境病毒，并尝试加入一点蜘蛛基因，为此，蜘蛛侠甚至减少了一部分夜巡时间。</p><p>他们各自忙碌着，也互相陪伴着。托尼会让彼得帮忙调整战衣的参数，彼得请教托尼关于之前研究的数据；小彼得则在更多的时候承担了日常与托尼交流的任务——自从知道这是另一个宇宙后，彼得基本只在推进研究时出现；当然在意识里，他教导小彼得知识、战斗、对蜘蛛基因的开发，分享经验、过往与未来，还有对斯塔克先生的爱慕与思念。</p><p>托尼发现彼得确实是个不亚于他的天才，他们在各种方面都非常合拍，彼得能跟上他的思维，甚至带来不少启发——大彼得的知识储备很丰富，虽然似乎缺少一些系统性，但这无伤大雅，他的优秀毋庸置疑；而小彼得虽然这知识量上有所欠缺，但总能一针见血地看到本质，托尼想他的小蜘蛛只是缺少一些时间，他无比期待他的成长，也期待着他们的未来。</p><p>而时间就在忙碌中悄然流逝。</p><p>09</p><p>“哇哦～不得不说，虽然是我同意的重启绝境病毒的研究，但是能这么短时间内完成到这个地步也确实是超出我的预料了，虽然也只有一点点。”托尼惊叹，多么耀眼的天才，难怪另一个他和彼得的关系会这样亲近，如果是他的话，也一定会忍不住靠近这个孩子，“彼得，你、你们确实完全是天才！”</p><p>彼得听着托尼直白的夸赞，红着脸微微低下了头，得到斯塔克的夸奖可不是一件容易的事情，这会是他无比珍贵的回忆之一。</p><p>他虽然没有上大学，但这些年来，为了自己的身体，装备，AI小姐，以及紊乱的激素，为了所有支持蜘蛛侠继续活下去当好邻居的一切，彼得学习了很多东西。</p><p>为了拯救蜘蛛侠，彼得做出了抑制器，而现在为了他所爱的另一部分，他也能和小彼得一起，改良出一份完美的、至少可以投入使用的绝境病毒。彼得很有经验。</p><p>托尼走向他，拍了拍他的肩膀，又说：“看来未来你真的吃了很多苦，也成长了很多，孩子，我为你骄傲。”</p><p>彼得抬起头呆呆地望着托尼，场面怎么似乎变得严肃起来。</p><p>但斯塔克从来不会让氛围严肃太久。</p><p>“嗯，或许也可以给我留下一份血清？我是说，毕竟，我们或许也要面临一场惨烈的战争？还有…彼得，我毕竟比你——还有小彼得——年长这么多，它能改造身体，让我恢复到更好的状态不是吗？我们会有更多时间……相互陪伴——鉴于你糟糕的生活，我想我还是得一直看着你才好。”托尼玩笑道，“哦！一个重新变得精力充沛的斯塔克，可能会变成很多人的噩梦了。”</p><p>彼得终于笑了出来，那似乎总被愁苦压制的眉眼舒展开来，他握住了托尼的手：“当然，斯塔克先生……这本就是您的样本，也只是为托尼斯塔克而改造的血清，您拥有所有权利。事实上，斯塔克先生，我让星期五保留了所有相关的信息，您可以和小彼一起继续改进它…某种程度上，这是属于您的。”他顿了顿，“而我，嗯，我只是，只是需要带走属于我的斯塔克先生的那一份。虽然，因为样本有限还有其他各种原因什么的，我们本来就只做出了两份……”</p><p>“不过，还有一个问题。”彼得又变得苦恼起来，“现在我需要携带一份实物回到属于我的宇宙，我是说现在的问题不仅是如何把一个灵魂或者意识送回他的身体，而且加上了如何偷渡一份绝境病毒……也许奇异博士的咒语已经不足以完成这一切…我是说，即使他可以，他也不会允许的，守护多元宇宙什么的，我明白。可是……”他又低落下去，或许他可以在回去后再重新制作血清，可是在他的宇宙绝境病毒已经被托尼销毁，而他也没有足够的资源来完成这一切。</p><p>“我是说，斯塔克先生，我或许需要一台能够联通两个宇宙的机器…就像时间机器什么的，我们需要空间机器。如果奇异博士不同意将这份血清和我一起送回去…我们需要一点其他办法。但同时我又不能让他破坏多元宇宙的平衡，我已经搞砸过一次了！</p><p>不不不，要不我们还是去寻求奇异博士的帮助吧！我也，我也不一定要带一份绝境病毒当异世界伴手礼…能够知道在某个宇宙中钢铁侠和蜘蛛侠会有一个更好的结局已经很好了……”</p><p>托尼看着眼前这个总是思虑过多的男孩，他难以想象这只来自另一个宇宙的小蜘蛛在他不在的年月里遭受了多少苦难，二十一岁还是上学的年纪，在他的设想中，彼得最大的困扰应该是教授布置的作业又要完不成，或者喜欢的对象拒绝了他的表白；而对守护纽约的蜘蛛侠来说，困扰也应该只是遇到了一个不那么好应付的反派，或者又因为闯祸被导师训斥——但这些都没什么大不了的，托尼相信自己有能力为他的男孩解决所有烂摊子，也无疑可以达成他几乎所有的愿望。而绝不是像现在这样，让他在失去一切后独自背负所有。</p><p>看来钢铁侠并非无所不能，他无法活着，继续为心爱的男孩保驾护航。</p><p>但是托尼斯塔克还有机会。</p><p>“事实上，孩子，在你努力的这些日子里，我也在推进有关多元宇宙穿梭相关的研究…且毫无疑问取得了一定成果。甚至去造访了圣所。你说过由于那个奇怪博士的咒语失控，多元宇宙的人们曾经来到过你的宇宙，所以，世界的壁垒并非牢不可破。对于灵魂或意识我确实有些束手无措，对此我们或许只能寻求专业人士的帮助。但如果只是需要带回一份非生命的实体，这并不是一件难以达成的事情，不需要画圈圈的帮助我也可以做到——借助一些脑电波定位或者能量波动追踪什么的。而我保证会控制好一切，不会产生额外的影响。”托尼拉着彼得在实验台边坐下，这个年长的蜘蛛侠明明更加成熟，却看上去总是比他的小蜘蛛更需要关怀，“相信斯塔克，好吗？别为这些困扰。事情并没有那么难以解决。”</p><p>“可是这样可能会破坏多元宇宙的平衡…造成更加不可估量的后果，什么的。斯塔克先生，我已经搞砸过一次了。”彼得嗫嚅着，他不希望只是因为自己的私心而再次造成什么破坏，导致另一些无法挽回的后果降临。</p><p>托尼翻了个白眼：“哦亲爱的，宇宙不会这么脆弱的——呃，应该不会？事实上，我问过那个魔术师了，他的确不同意直接帮忙送一个跨世界快递，但也没有明确反对我去这么做，虽然也可能是认为我——我们做不到。well，不管怎么样，我都会帮你达成心愿的。”</p><p>托尼摊了摊手，想到那个法师望着他时的奇怪眼神，如果你能做到，那这就是被允许的，法师这样说。</p><p>“毕竟，你知道的，斯塔克向来专制独裁。”</p><p>彼得又抱住了托尼，摇头：“不，您是最好的斯塔克先生，一直都是。”</p><p>小彼得悄悄探头：“我同意，斯塔克先生是最完美的！”</p><p>10</p><p>一切已经准备就绪，奇异博士答应负责将这个误入的灵魂送回他的身体，托尼也已经成功借此锁定了坐标，准备完成这个跨宇宙的绝境病毒快送服务</p><p>“再见，彼得。祝你一切顺利。”托尼拍了拍彼得的肩膀，犹豫了一下，又将他揽进怀里，给了一个拥抱，“无论如何…照顾好自己。”</p><p>小彼得也在意识中与他告别：“再见～另一个世界的未来的我，遇见你真的很酷！当然你本人——也就是我本人，也真的很酷！不过我一定会做得比你更好的，在未来！”</p><p>彼得感受着斯塔克先生温暖的怀抱，他感谢宇宙这个小小的玩笑，让他能再次见到他的家人与朋友，还有斯塔克先生，与另一个自己。但彼得已经不再需要贪恋这一切，他还有机会再次拥抱他的斯塔克先生，一定会的。</p><p>于是彼得从那个怀抱中退出来，郑重地道别。</p><p>“谢谢您，斯塔克先生，谢谢您为我们做的一切。也谢谢你，小彼，谢谢你让我借用你的身体，让我有机会再次见到梅，和大家。你会变得比我更好的，毫无疑问。我想你们会拥有一个更好的未来、更好的结局。很高兴见到你们，真的。”</p><p>“当然，孩子，毕竟我们得到了一份剧透攻略。”托尼俏皮地朝他眨眨眼，“放心吧，如果这样我们都打不出完美结局，那么也怪不了那个紫薯选择打响指了。”</p><p>“别这么说，斯塔克先生。”</p><p>“至少我会阻止斯塔克先生去打响指的。”小彼得悄悄向彼得保证，“但我想我们不会走到这一步。”</p><p>“我说，你们差不多就行了。我要准备把你送回去了，蜘蛛侠先生。”旁观一切的奇异博士很无语，看来并不是所有人都喜欢看依依惜别的苦情戏。</p><p>托尼表演了他最擅长的美瞳滑片：“知道你是个孤家寡人了，马戏之王。”</p><p>“懒得和你废话，斯塔克。”奇异博士施展了咒语。托尼也同时让星期五启动了他的快送机器那管绝境血清追着彼得的波动去了。</p><p>一切风平浪静。</p><p>“……小彼？他离开了吗？”托尼有点迟疑。</p><p>小彼得仔细感受了一下，他的脑子里已经听不见另一个彼得的声音了。</p><p>“呃…应该是？我已经感觉不到他了。”小彼得也有些迟疑。</p><p>那边奇异博士已经准备画圈离开，但他不得不说：“别怀疑我的能力，斯塔克。你应该担心你的机器能不能成功。别以为我不知道你们的偷渡行为，呵呵。”</p><p>“也别怀疑我的能力。”托尼原话奉还。但奇异博士已经离开了，他的话只能给讲给空气听。</p><p>哦，还有一个他的小蜘蛛侠。</p><p>小彼得悄悄上前，然后大力抱住了托尼，他闷闷道：“我也想要一个拥抱……我们现在达到这种程度了吗？斯塔克先生。”</p><p>托尼好笑地拍了拍小彼得的后背：“当然，当然，想抱就抱吧，随时欢迎，我的蜘蛛宝宝。”</p><p>他们还有很长的时间。</p><p>11</p><p>彼得终于回到了他自己的身体里——其实感觉并不怎么好，他的伤口还隐隐作痛，身体也没有小彼得那么健康。</p><p>他睁开眼睛，看到弗兰克就在床尾。</p><p>“哦，谢天谢地，小子，你可算醒了！”弗兰克看上去非常激动，“医生说你差点要脑死亡了！多谢你救下的那个女孩，她一直用她神奇的能力保住你的命。哦，她很好，应该才刚离开。”</p><p>“嘿……弗兰克，你是哭了吗？”彼得忍不住笑了，这里也依旧有人在关心他，在意他，这感觉很不错。他摸了摸自己身边，毫无疑问得到了一管和他一起抵达的绝境病毒，斯塔克先生的跨宇宙快递服务也是完美无瑕。</p><p>“什么？当然没有！我才没有哭！”那边弗兰克连忙否认，他很高兴看到蜘蛛侠恢复生气与活力，但也还是要维护自己的形象。</p><p>“好吧，弗兰克。谢谢你，还有琴，谢谢你们。”彼得坐起身子，“不过，我还有非常重要的事情要去做……如果一切顺利的话，我会再来拜访你的，但是现在我得先走了。”</p><p>弗兰克认真打量了彼得一番，确认他可以正常行动，他指了指窗外：“外面可来了不少人，他们都很关心蜘蛛侠的情况。不过，我有个好主意，能让你完美脱身。”</p><p>12</p><p>从医院离开后，彼得回到了自己的出租屋，他拖出了悄悄藏下的时间机器——理论上，它应该被废弃甚至销毁了，但是就像彼得告诉小彼得的那样，他带回了这台简易装置，在遗忘咒之前，彼得有一部分处理托尼遗物的权利。这些年来也一直在尝试研究与改进这台机器，他甚至得到了一管皮姆粒子。</p><p>彼得的所思所念都被留在了过去，他多么希望能再回到过去；但奇异博士告诉他不能扰乱时间线，来自多元宇宙的危险也警示他不能擅作主张。</p><p>而彼得虽然留恋过往，却并不沉溺于过去，他永远有迈向明天的勇气。</p><p>于是他从来没有主动尝试过启动时间机器。这只是一个念想，用以睹物思人。</p><p>但现在不一样，在刚刚结束的那场奇遇中，他本来以为回到了自己的过去（彼得必须承认，虽然他没有主动去干涉过去，但如果真的有机会回到过去，他无法控制自己去改变些什么，即使那可能变成一个新的宇宙），只是寄宿在少年时的身体里，他的到来形成了一条新的时间线，他会有一个新的未来。后来事实证明那本就是另一个宇宙，未来还没有定型，而彼得至少成功阻止了一个糟糕的结局——尽管那个美好的未来已经与他无关。</p><p>来自另一个宇宙的礼物让他找到了一个不会扰乱时间线也能救回斯塔克先生的方法，他已经准备好了一切，时间机器、皮姆粒子、绝境病毒、还有早就校准过无数次的时空坐标——这甚至得到了托尼斯塔克本人的许可，还有另一个奇异博士，彼得觉得奇异博士知道他想做什么，但他并没有阻止不是吗？</p><p>彼得使用时间机器回到了终局之战的战场上，却依旧只能眼睁睁地看着钢铁侠打响那个决定宇宙命运的响指后“死去”。但他可以在托尼消失之前带走他——前往五年后，前往他的时间线，这个宇宙现在所处的时间线。</p><p>他也终于清楚了当年托尼斯塔克“尸体”的去向，在打完响指后，钢铁侠很快就消失在了宇宙里，没有留下一点痕迹，所有人都以为这也是无限宝石收取的代价之一。无限宝石的力量掩盖了时空波动。</p><p>原来那不是代价，是一场来自五年后的劫持。</p><p>于是托尼斯塔克在这五年里并不存在，一切仍旧向前，伊迪丝，神秘客，多元宇宙反派，遗忘咒语，弗兰克，琴，损害控制局，还有那一枪再次改变他命运的巴雷特，一切依旧发生，什么也没有改变。彼得帕克的人生似乎在托尼斯塔克离开后很快就急转直下，哪怕纽约的好邻居蜘蛛侠依旧守护这座城市，依旧勇敢善良，但彼得帕克的一部分，在这五年里似乎也早随着导师的猝然离开而永久消失了。</p><p>但是今天，彼得找回了这消失的一部分。</p><p>——他带回了托尼斯塔克，从那个战场上。</p><p>感谢另一位斯塔克先生和帕克先生的慷慨赞助，绝境病毒实在是很神奇的东西，他成功让托尼的心脏重新开始跳动，效果比他想象中更好。彼得望着托尼胸前反应堆散发的幽蓝色光芒，几乎要落下泪来。他伸手覆上反应堆，如同五年前那般，那时候托尼斯塔克在他手下消失无踪，而现在托尼的心脏仍在跳动，他们的故事得以重新接续。</p><p>对斯塔克先生而言，这是否也只是一瞬间呢，就像我从烁灭中回来那样？斯塔克先生睁开眼睛后，看到的依然是我，好像我们从未分离。彼得漫无边际地想。</p><p>彼得曾烁灭五年，而托尼已经死亡五年。他们之间的年岁差距在残忍的互相错过中又被重新抹平。钢铁侠将蜘蛛侠从烁灭中带回来，蜘蛛侠也可以把钢铁侠从死神手里抢回来。无论错过多少时间，他们总会重逢。</p><p>“EV，斯塔克先生什么时候才能醒来？”彼得轻声询问他忠诚的AI小姐。</p><p>“彼得，绝境病毒正在修复斯塔克先生的身体，从目前的进度来看，斯塔克先生会在半小时内醒来。”</p><p>听到这则好消息，彼得反而感到焦虑起来，他在这个狭小的房间里团团转，小声地碎碎念着：“哦斯塔克先生会对我失望吗？我是说我毕竟搞砸了一切，不不，或许我应该先想想该如何向斯塔克先生解释现在的一切，解释我是怎么把他从2023年偷走到2028年的吗！还是先向他说明另一个宇宙的故事？”还有最重要的一件事情，“斯塔克先生真的想要被救下来、然后回到这个糟糕的五年后的世界吗？”</p><p>“彼得，检测到你体内蜘蛛激素升高，是否需要干预？”</p><p>“哦不不不需要EV！我很好！”事实上，他从来没觉得这么好过。“呼——彼得帕克，冷静一点冷静一点，你可以的！”他开始组织语言，试图理顺这个漫长的故事，但他实在太兴奋又太害怕了，以至于聪明的脑袋也离家出走，他重复着一些关键词，企图完整拼凑出一切需要向斯塔克先生解释的内容，而一切却只是像毛线球一样越来越乱，彼得苦恼地抓了抓他卷曲的头发，这让他看起来更像一只凌乱小狗了。</p><p>忽然，他听见床上传来动静，“咳咳，kid，我并不着急听故事……”彼得闪向床边，看见斯塔克先生睁开了那双漂亮而深邃的焦糖色眼眸，让彼得这间破旧狭小的出租屋也明亮起来，他脸上仍残存着被灼烧的疤痕——绝境病毒会逐渐修复这些响指的余烬——但丝毫不减他的风采，不如说，彼得是如此怀念着这张脸庞，和它的主人。</p><p>托尼也看见了彼得那张年长了不少的、散落着伤痕的脸庞，他珍视的孩子显然吃了不少苦，以至于强悍的蜘蛛基因也来不及修复这些大大小小或新或旧的伤疤与淤青，不变的是那双依旧亮晶晶地注视着他的眼睛。</p><p>彼得身上发生了什么，以及他是怎么活着出现在这里的，托尼都会去搞明白，但是当下最重要并不是这些，而是——“我想，现在我们需要的是，一个拥抱？或者一个吻？”</p><p>他撑起身子，张开双臂。</p><p>彼得小心翼翼地扑进托尼的怀里，泪水已经蓄满了他的眼眶。他真的成功了！</p><p>他们拥抱住自己失而复得的珍宝。</p><p>他们还有很长的时间。</p><p>————————————</p><p>end</p><p></p>"}, {"id": "w1", "title": "红尘梦", "type": "同人小说", "series": "他们的平行世界", "excerpt": "一个关于天外飞仙和红尘来客的故事。 章1", "body": "<p>一个关于天外飞仙和红尘来客的故事。</p><p>章1</p><p>碧海长青。</p><p>叶孤城在海边练剑。</p><p>一剑，挥出便是劈波斩浪，势不可当。</p><p>飞仙岛坐落于茫茫大海之中，而大海从来是不够温柔的，海浪不比溪流涓细，而是汹涌奔腾，带有如雷霆般的一往无前。然而纵使它有再大的气势，却始终无法沾湿白衣剑客的一片衣角。</p><p>一剑，光辉灿烂，如天边浮云，如云上孤月，缥缈而又皎洁。</p><p>除了叶孤城，还有谁能挥出这样的剑！</p><p>白衣剑客在阵阵海鸥鸣声中收了剑，转身。</p><p>风吹起他的衣袍，吻过他的面颊，却无法在他琉璃般的眼眸中激起半点波澜。</p><p>白衣的剑客本是无情的、心无旁骛的，可今日叶孤城却无法放空身心。</p><p>他在想什么？是什么让他无法静心？</p><p>——他在想他的梦。</p><p>一个梦，怎么可能会困扰无瑕无垢的天外飞仙，怎么可能会在冷峻的剑客心中留下波澜。</p><p>可叶孤城偏偏在想一个梦。</p><p>这个梦，必然不会。 是普通的梦！</p><p>这个梦，也确实不是普通的梦。</p><p>他梦见了什么？</p><p>一个青衣的男子，一把剑。</p><p>一个青衣的剑客！一把，红尘之中的宝剑！</p><p>红尘，飞仙，它们是多么格格不入！叶孤城怎么会梦到这样的一把剑！</p><p>青衣的剑客倚在船栏边对月自酌，腰上系着他的剑。</p><p>他已有好些醉意。</p><p>忽而，他轻轻地笑了一笑:“阁下既已旁观许久，何不现身与某共饮一杯？”</p><p>叶孤城知道他在做梦，可他不知道梦中人为什么能看见他，但是他还是现出了身形。</p><p>或许是因为，那个青衣人的剑。</p><p>“你用剑？”</p><p>叶孤城声音冷冷的，比湖心的风还冷，比高悬的月还冷。</p><p>他看到了青衣人的剑，却也闻到了青衣人的酒。</p><p>一个剑客，本不应该喝酒。酒会让大脑麻痹，会让拿剑的手变慢，会让他的剑变得难以控制；酒，或许会让剑客死亡！</p><p>于是叶孤城的声音比夜晚的冷风还冷——毕竟，剑客，对同为剑客的人，向来有一些奇怪的要求，尤其，叶孤城还是一个非常优秀的剑客。</p><p>但是青衣人混不在意地大笑:“某当然用剑！”他的笑，却比天上的星子还璀璨自信。</p><p>然而叶孤城并没有被这个好看的笑晃了神，相反，他的的声音更冷了:“你既然用剑，就不该喝酒！”</p><p>“为何不该喝？酒里是酸甜苦辣，是悲欢离合，是红尘万丈。”青衣人疑惑地看了叶孤城一眼，忽然用力将酒盅掷进湖中，溅起波澜阵阵，“酒里，有我的剑！”</p><p>他倏然拔剑起身，叶孤城的手也立刻握上了剑柄，不想却见那青衣男子踏江而舞。</p><p>舞的是剑，剑光盖过了月光，剑风却携来了不远处的万家灯火。</p><p>青衣剑客的剑越舞越快，叶孤城的眼睛越来越亮。</p><p>不知是否是因为梦的缘故，叶孤城已看不清青衣人的脸庞，却能清晰地感受到他的剑气。</p><p>红尘万丈。</p><p>这是叶孤城见过的最美的剑舞，也是最特殊的剑！</p><p>青衣的剑客已回到了船上。</p><p>叶孤城早已迫不及待:“愿与君一战！”</p><p>然而青衣人摇了摇头，扬声回道:“某今日既然已经为阁下舞了剑，便不想再与阁下比剑！”</p><p>他收了剑，装模作样地做了个揖，笑道：“某名尘观。为静观红尘之人。”</p><p>“叶孤城！”</p><p>然后他便醒了过来。</p><p>章2</p><p>叶孤城醒后也在想他的梦。</p><p>或许他想的不是梦，而是那个名叫尘观的剑客，和他那不同寻常的剑。</p><p>只是舞剑，竟有世间烟火味！不像白云城主的青天白日无瑕无垢，也不似万梅山庄庄主的寒气凛然孤高清傲。青衣剑客的剑，竟像是从滚滚红尘行过，只一把剑，便是世界，便是天地。</p><p>只可惜，他们只交换了名。</p><p>思及此，叶孤城难得地叹了口气。</p><p>这样的剑，今后又有何处能见？</p><p>这样的人，今后又有何处可寻？</p><p>这样的人有着这样的剑，怎能不让叶孤城难以忘怀？</p><p>于是叶孤城想到了塞北的万梅山庄。</p><p>万梅山庄中有没有一万株梅花不重要！重要的是万梅山庄的主人！</p><p>西门吹雪！</p><p>剑神，西门吹雪！</p><p>与剑仙叶孤城齐名的剑神，西门吹雪！</p><p>但是西门吹雪也没有尘观的剑。西门吹雪的剑与叶孤城的剑一样，是无情的剑！</p><p>无情的剑，剑中自然只是杀意，怎么都不会有烟火气。有烟火气的不是无情的剑，是尘观的剑！</p><p>尘观，尘观，静观红尘。</p><p>叶孤城心里默念了几遍这个名字。</p><p>那个青衣剑客，是不是就在静观红尘中领悟了红尘？领悟了他独特的剑？</p><p>他无从得知。毕竟他们只有一面之缘——甚至只是梦中的一面之缘！</p><p>于是他又轻轻叹了口气。</p><p>他无比遗憾那只是一个梦，他甚至没有看清青衣剑客的容貌，只记得他的眼，他含笑的眸子，像是两颗星辰在青衣人眼眶中安家落户。</p><p>叶孤城抱着他的剑，一路慢慢走着，一路默默思考着，细细回顾他那个短暂而又奇妙的梦。</p><p>叶孤城回到书房。他不仅是一位强大的剑客，更是这座白云城的城主，除了练剑外，自然也有一些事务处理。叶孤城向来是个足够负责的城主，白云城百姓是他的子民，他便努力为他们创造好的生活环境，不受外敌干预、平凡却也富足的生活。所以，白云城的百姓也无比爱戴他们的城主。</p><p>南海群剑之首，叶孤城，是他们的城主！谁能不自豪？谁能不骄傲？白云城的百姓走路带风，做事带笑。他们生活幸福，因为他们有一位最好的城主！</p><p>叶孤城是个负责的城主，也是个有能力的城主，况且白云城中能让他过目的大事也不算很多，所以他很快就将事情处理完毕。</p><p>他还是拿出了他的剑，细细地擦拭他的剑，温柔细致宛如对待最心爱的情人。</p><p>或许比起女人，一把剑，才更有可能成为叶孤城的情人。</p><p>拭剑，试剑，本就是与剑交流的过程。</p><p>时间不知不觉地流逝，城主府的婢女轻声细语地唤她们的城主用膳。</p><p>叶孤城吃完饭，又练了字。</p><p>“一剑入红尘”</p><p>原来他还在想尘观，还在看一柄来自红尘的剑。</p><p>但他已在塌下躺下准备休憩。</p><p>叶孤城察觉到他又在做梦，因为他又见到了尘观。</p><p>尘观这次并没有穿青衣，他换了一身墨裳。</p><p>他在下棋。</p><p>黑子，黑衣，更衬得他肤白如玉。</p><p>阳光正好，这次叶孤城看清了他的脸。长眉入鬓，桃花眸潋滟，端的是公子风流。</p><p>尘观沉静落下一子，忽又朗声笑道:“阁下何不陪某下完这局棋？”</p><p>叶孤城于是走了出来，在尘观另一侧入座。</p><p>“原来是叶兄。”那双好看的桃花眸弯了弯，“请。”</p><p>叶孤城执白子，道:“你记得我？”</p><p>“某自然记得，半月前某在湛月湖喝酒，叶兄告诉我剑客不该喝酒，是也不是？”</p><p>叶孤城不知道湛月湖是什么湖，但他还是回道：“是！”</p><p>“某为叶兄舞了剑，是也不是？”</p><p>“是！”</p><p>“某只为朋友舞剑，某既为叶兄舞了剑，叶兄便已是某的朋友！”他掷地有声道,“某自然会记得朋友？”</p><p>“朋友？”叶孤城奇道。</p><p>“某用剑，叶兄也用剑，相逢即是有缘，某将叶兄当作朋友！”</p><p>这话很简单，却又太真诚，太有力，连冷清的叶孤城也为之动容。他也大声道:“朋友！”</p><p>尘观却狡黠地炸了眨眼，他本是一派风流侠客相，此刻却多了几分少年意气。他道:“某注意到叶兄一直关注某的剑。”</p><p>“是！”叶孤城大方承认，“我从没有见过这样的剑！”</p><p>“因为某的剑，本就独一无二！”尘观显然对自己的剑自豪无比，“某的剑——曰红尘剑！”</p><p>红尘剑，红尘剑。</p><p>叶孤城默默咀嚼这几个字，与他想的果真一致。</p><p>但他还是询问道:“红尘剑，是怎样的剑？”叶孤城从来不曾见过这样的剑，在他心中，剑，应是冰冷的；真正的剑客，也是少有几分温度的。</p><p>这把红尘，却是温柔的、浪漫的，这个剑客，也是热情的、多情的。</p><p>尘观傲然道:“我的剑，便是红尘！红尘剑，就是我的剑！”</p><p>叶孤城仍有疑惑，尘观却不欲再答。他们静静地下完了一盘棋。</p><p>和棋。</p><p>尘观整整衣袖，笑道:“叶兄总是在出人意料的地方出现。”</p><p>叶孤城却不知道怎么回答，告诉尘观，他在做梦么？告诉尘观，对他来说，他只是一个梦中的人物？</p><p>叶孤城自己都不明白怎会有这样的梦。</p><p>叶孤城只能看着自己的剑，一时无言。</p><p>尘观是个善解人意的剑客，对朋友不愿意说的事情，绝不会刨根问底，他注意到面前的白衣剑客的目光。</p><p>一柄绝世好剑。</p><p>于是他由衷赞道:“好剑！”</p><p>“自然是好剑！”谈及自己的剑，叶孤城也从不会自谦，他的剑，当然是极好的。</p><p>尘观却又说:“剑好，人更好。”他也轻柔地抚着红尘剑的剑柄，“某的红尘也是好剑，某却不是叶兄这样的人！”</p><p>叶孤城曾经是相信剑客，就应该是像他或是西门吹雪那般，素衣飘飘，看似纤尘不染而又冷淡清傲的。然而很不幸，尘观既不只穿白衣也一点也不冷淡。</p><p>但是，他早已承认尘观的剑。</p><p>“你，也很好！”叶孤城真心实意地赞道，琉璃色的眼眸中闪烁着奇妙的光芒。</p><p>尘观只是笑笑，又道:“那晚叶兄踏月色而至，某本以为见到了天上仙人，舞剑欲邀仙人喝酒，仙人却是来去匆匆啊！”</p><p>叶孤城难得有些不自在，心道：并非来去匆匆，而是一梦初醒罢.</p><p>但他无法将这说出来。一个梦？多么荒谬！梦里怎会有这般出尘的人物？可若说这不是一个梦，那这又是什么？</p><p>于是叶孤城只好说道:“我不喝酒。”</p><p>于叶孤城而言，一个合格的剑客，是不应该沾酒的。任何人都可以喝酒，唯有剑客不行。</p><p>尘观点点头:“某见过很多叶兄这样不喝酒的剑客。”他眼中突然多了几分向往的神采，“他们的剑，很快，很利，也很没有人情味。有时候他们站在那里，不像是人，而是一柄剑。”</p><p>叶孤城沉思道:“手中之剑，即是心中之剑。”</p><p>“不过道之载体。”</p><p>“何为剑道？”</p><p>“叶兄想听某的回答？”</p><p>“不错！”</p><p>“某的剑道，在心！心住红尘，剑指红尘。我心常在，我剑常新。我心不灭，剑锋不灭！”</p><p>尘观神秘地笑了一笑:“下次再见叶兄，某便邀叶兄赏某的剑。”</p><p>叶孤城还想说些什么，梦却醒了。留下尘观一人独坐桌旁，却未曾因为客人瞬间消失而感到疑惑。</p><p>黑衣剑客抿唇轻笑，慢慢将棋子一一拾回。</p><p>章3</p><p>叶孤城又醒了过来。</p><p>他梦到了同一个人，同一把剑，这是巧合吗？这是必然吗？</p><p>尘观，尘观。这位淡漠的白云城主忍不住再次在心里默念这个名字。</p><p>“下次再见，某便邀叶兄赏某的剑。”</p><p>尘观已为他舞剑，天外飞仙却仍不曾出鞘。</p><p>叶孤城心里默默做出了一个决定，一个能让所有人惊奇的决定。</p><p>“朋友？”他喃喃自语，忽然又坚定了语气,“朋友！”</p><p>他已将尘观看作朋友！</p><p>既然是朋友，就不需要论什么梦里梦外，那样优秀的剑，那样特别的人，总不该只是一场幻梦。他相信，他们必会再见——或许在下一个梦里，或许就在明天！</p><p>花开两朵，各表一枝。</p><p>这边叶孤城起身练剑，那边尘观也收拾棋子离开。</p><p>他去找一个人。</p><p>他从半月前就开始找这个人，今天，本是他们约定相见的日子，不料先见着了叶孤城，也算意外之喜。</p><p>他在找谁？</p><p>不可说！</p><p>为何不可说？</p><p>不是不可说，而是，那人便称作“不可说”。据说此人通天晓地，武功早已臻化境，距离破碎虚空亦不过半步之遥，不过早年这位“不可说”声明“红尘冷暖未曾享尽，虚空之上寂寞难抑”，迟迟不愿踏出最后一步，反倒从此隐姓埋名，浪迹天涯，难寻踪迹。</p><p>尘观要找他，显然是为了询问叶孤城。他是个洒脱的剑客，也是个有好奇心的江湖人，他想知道，这位身似飞仙，行动也神出鬼没如飞仙的朋友究竟是什么来头。</p><p>街上人声喧闹，尘观便是在这喧哗的街道尽头见到了“不可说”。</p><p>“前辈，在下尘观。”尘观拱手，算是见过这位颇具传奇色彩的江湖前辈。</p><p>“不可说”穿着一身破布麻衣斜倚在街巷角落，他懒懒地抬眸瞥了眼尘观，挥手道:“小友寻吾的目的吾已知晓。”</p><p>他站起身，神秘道:“纵非天上仙，亦为世外客。尘观小友，你的道已至瓶颈，此人或是你的一场机缘。”</p><p>尘观扬眉:“天上仙，世外客。佛说一花一世界，武者亦寻求一个破碎虚空，当确是有世界之外？”</p><p>“不可说”道:“不过是大道三千，小友与客人道可相互补益罢了。”他叹了口气，“待小友于剑道再进一步，便可轻易解除今日之惑。如今，无须急切，不过只要把握这场来之不易的大机遇。”</p><p>尘观垂眸敛目，心里细细思索起“不可说”所言。这位前辈是江湖上已知的最接近“天道”的顶级武者，所思所言所为甚至已带上一分“天意”，既然他说只要把握机缘，尘观也不会刻意寻求一个“真相”，如此，他便真诚谢过“不可说”:“多谢前辈解惑。”</p><p>“不可说”摇摇头，却提了另一个话题:“昆仑六剑派的比试就在一月后，小友或许可往。”话落，他就已消失在尘观面前。</p><p>尘观眼中多了几分向往之色，扬声道:“多谢前辈告知！”</p><p>剑客的对决显然是足以吸引一位出色的剑客的，尘观想着，或许他的那位世外朋友也能与他共享这场难得的盛宴。</p><p>叶孤城，一叶孤城。</p><p>尘观默默念着这个名字，洒然一笑，世外客如何，天上仙如何，他为他舞了剑，他只知道，叶孤城，是他尘观的朋友！</p><p>章4</p><p>哈哈</p>"}, {"id": "w2", "title": "八重梦境", "type": "小说", "series": "往暮色深处", "excerpt": "献给我的梦境诗 从白日梦大王到救世主。", "body": "<p>献给我的梦境诗</p><p>从白日梦大王到救世主。</p><p></p><p>我</p><p>我又一次从梦中惊醒，大口大口喘着粗气。</p><p>从高空坠落的感受太过真实，我看着梦中的“我”为了躲避什么从楼顶一跃而下，半空中呼啸的风声和追赶者扭曲的哭声笑声叫喊声仿佛犹在耳畔，那种失重感，那种无法喘息的窒息感，那种眼珠爆裂的挤压感……这个梦，实在过分真实，我不愿再想，也不敢再想。</p><p>……后面追赶我的，究竟是什么？又为什么要对我穷追不舍？</p><p>最近很不对劲，这种感觉前所未有地强烈。我整宿整宿地做梦，睡眠时间越来越差，甚至于快要分不清梦境与现实，无穷的追逐奔逃让我精疲力竭，这种疲惫在醒后也久久不散。</p><p>其实我并不讨厌做梦，甚至向来将梦境视为一次新的人生，凭借梦境，我拥有了除却无聊乏味现实的许多许多新的人生，开展在现实中永远不能进行的冒险——这，很好。我甚至羡慕梦中人的自由自在，羡慕她跳出世俗框架的冒险旅途。那可能是我憧憬的一部分映射。</p><p>然而最近的梦，它太奇怪也太恐怖。我看不清追逐我的“怪物”们的真实面貌，也听不清那些细细簌簌的窃窃私语，却又无比真实地感受到惊惧，似乎我听不清看不见并不是因为这是梦，而是——我本就无法听也无法看；可是我又分明能够清楚地记得我经历的每个情节。我一个人在梦中拼命奔跑、躲藏，却遇不到任何我的“同类”并肩作战。对于一个梦来说，这其实是很正常的，我很清楚这一点。但是我实在无法忍受夜复一夜的同类梦境，它们在引诱我，追捕我，甚至——同化我！</p><p>思及此，我不禁冷汗涔涔。</p><p>难道是最近压力太大了吗？还是灾难片看多了导致夜有所梦？无论如何，这已经不是简单的梦了，我需要帮助，我需要帮助！</p><p>解梦师</p><p>“我需要解梦。”我找到了业内知名的解梦师，说实话，我其实并不相信这些神神叨叨的东西，但是现在，筋疲力尽的我需要有一个第三者给出的解释——我无法再忍受了！这些如同梦魇般的的恶鬼，这些使我不得安眠的无数梦境，这些真实到让我毛骨悚然的追杀与奔逃。我不信这些东西，可，我不得不求助于它们，寄希望于得到合理的解释和可行的解决方案。</p><p>然而，未等我向解梦师叙述我的情况，她便怪异地瞥了我一眼，放下了手中握着的笔，一手托腮，一手用指关节敲了敲桌子，缓缓道：“你知道，那不是梦，你知道的。”</p><p>闻此，我悚然一惊。不是梦？那它是什么？那分明就是一场梦——一场纠缠我许久的噩梦！我张了张口，想说些什么，却又在出声前被她打断。</p><p>“请回吧，我只是解梦师，无法解决你的问题。”她露出一个神秘的笑容，“又或者，这并不是什么问题，而是礼物呢。”</p><p>我默然不语，心里仍对解梦师的神神叨叨的话有所怀疑，良久索性转身离开，我知道，我无法从她那里得到我需要的答案。</p><p>我转身后，她似玩笑又似郑重地轻声道：“未来，在你……。”</p><p>她说的太轻，心烦意乱又头昏脑胀的我并没有听清楚这整句话。说实话，我本来就不信这些，也只当她只是不知道如何解梦而对我胡言乱语，这些莫名其妙的话也只是她逃避问题的方法。我在心里不断暗示自己，没错，那只是梦，那只是梦，是梦，只是一个太真实的梦。我不断肯定这一结论，然而我还是被她的说法影响，而那种惊悸和恐慌也依旧不曾散去。</p><p>那真的……只是梦吗？</p><p>灾变体</p><p>这个世界发生了微妙的变化，我想，没有人能逃过这场灾难，可是我还是要竭尽全力避免自己成为灾难的一部分。有时候我也怀疑自己，这只是一个梦，就算再怪异也终将清醒，我又为何需要担心这些有的没的呢？又或者，或许“死亡”或同化还能让我摆脱这场旷日持久的噩梦。然而，冥冥之中又似乎有什么警醒我，不要被同化，不要被吞噬，不要被捕捉！我不知道这种感觉从何而来，毕竟，这只是一场梦。</p><p>进化</p><p>幸运的是，灾变带来的不仅是失去理智的变异体，还有人类的进化——如果这算一种进化。我得到了飞行的能力，这大大提高了我躲避那些异变体追击的能力。</p><p>白梦</p><p>我在梦中遇到了与我一样的“正常人”，只是对视一眼，我就知道他与我是同类，是与梦中那些怪物完全不同的存在。</p><p>或许，我即将结束孤军奋战。这个猜测居然让我有一股想要落泪的冲动，我等了太久太久了，在这个充斥着绝望与灰暗的梦境中，我终于看到了一束也许是希望的光。我曾经希望以对抗睡眠的方式来对抗梦境，却根本无济于事，无论我做何种挣扎，只要到了零点，我都会毫无预兆地陷入沉睡，而后坠入这个诡谲的“梦境”——假设它确实是一个梦境。</p><p>前夕</p><p>世界正在融合，意识到这一点时，我的生活已经出现了很多诡异之事。梦境与现实的衔接愈发完美，仿佛真的有两段不同的人生被串联起来。</p><p>在路上昏昏沉沉时似乎看到浓雾之后的幽幽蓝光，与梦境中见到的灰蓝色一模一样，那是幻觉吗？是我精神问题的产物吗？还是……真实？我不知道。我真的不知道吗？还是只是不愿意承认？</p><p>要变天了，我前所未有地清醒认识到这一点。望着天边笼罩的、如鬼火般隐约有燃烧迹象的怪异乌云团，我不知为何想起了许久以前解梦师的话，“未来，在你……”，什么未来，在我的什么？</p><p>我能察觉到我的精神已经越来越不稳定，但是头脑却前所未有的清晰。我不能再坐以待毙了，我需要做些什么——可是我能做些什么？！我碌碌无为，平凡普通，胆怯懦弱，我能做些什么？我能改变什么？我甚至不知道能将这些变化告诉谁，我能改变的，只有我自己。</p><p>所以，最后我只是去办理了休学手续，我有预感，接下来的日子，我不会再有精力完成任何学业。负责的老师询问我原因，我其实说不出来，告诉她世界要变了吗？这倒也是个办法，毕竟这样她就会觉得我的脑子大概出了一些问题。其实，或许真的只是这样罢了，毕竟我没有任何证据表明我的梦，会成为现实。而这么想的我，不过是因为在巨大的压力下精神出现问题，竟然愚蠢又糊涂地将梦境和现实混淆。无论如何，总之我还算顺利地办理完了手续。走出办公楼，望着灰蓝色的天空，我感到一阵恍惚，再次怀疑自己的预感和选择。</p><p>“家园”</p><p>梦的领域越来越大，</p><p>大凶</p><p>出行前，易无钺为我们卜了一卦，卦象——“大凶”。</p><p>气氛有些压抑，大家都很沉默，其实我们也知道，这次冒险必然是十分危险的，可我们不能不去，不能不。最活泼的戴舒彦左顾右盼一番，企图活跃气氛：“哈哈，都什么时候啦这种东西信则有不信则无嘛，未来在我们自己手中啊，哈哈哈。哈……哈……”他又沉默下来，我知道他其实也很恐惧。我们相信自己的同伴，因此我们相信易无钺的占卜结果，但，我们也相信同伴，相信我们会互相保护，互相支持，互相拯救。</p><p>我缓慢抬头，坚定地看着我的同伴们：“没错，我们会顺利的。我会带你们回来，一定。”</p><p>无论心中作何感想，这次探险还是必须要去。异变的世界让所有的交通工具和联络方式都失去作用，而我的能力还不足以携带所有人一同飞行赶路，于是白梦与我通过飞行在前方探路，剩余四人，由封故带着身体虚弱的陈照，迅速跟在我们身后。天空的视野是更加广阔的，但这个奇怪的梦中世界到处弥漫着灰白色的雾气，在雾气掩盖后似乎有无数东西观测我们，所以其实也看不到什么东西。</p><p>一路上依旧有数不清的诡异东西追逐着我们，然而奇怪的是，我与白梦却并没有遭到任何攻击，这不会是因为他们没有飞行的能力，相反，在我还是孤身一人时，见识过许多临空的怪物，我亦不止一次地差点死在它们手中。不过得以安稳度过这一段路，我自然是很乐意的。</p><p>等到接近我们的终点时，我俯身带着白梦降落到地面与队友汇合，然而越靠近那里，那些追赶我们的东西慢慢散去，直至消失不见，我们感受到前所未有的凝重。那里一定有什么，让这些穷凶极恶、毫无理智的诡异都不得不退缩。</p><p>深渊</p><p>眼前的东西让我们一行人全部无言。</p><p>这是一个巨大的深渊，深渊下却不是一片黑暗，没有怪物，没有诡异，而是倒映的现实世界，被一个蓝色太阳照耀着的现实世界。而深渊的裂口，还在不断扩大。我们互相对视一眼，都看到了各自眼中的凝重。</p><p>我知道，世界，即将真正融合；我们，谁都逃不过这场灾难。</p><p>我终于悲伤地承认，这，真的不再是一个梦了。</p><p>忽然，地面一阵剧烈的晃动，</p><p>世界颠倒了——不，是这个梦境世界颠倒了，颠倒成和现实一样的方向</p><p>蓝日</p><p>太阳变成蓝色的那日，一切真正尘埃落定。一开始只是媒体报道，专家解释只是自然现象，是光折射的结果，群众也就乐呵呵接受，把蓝日当作一个好玩的打卡景色。</p><p>可我知道，真相将会颠覆所有人的思维。这个蓝色的太阳，不是我们的太阳。</p><p>那日，我感受到了我的力量，原本在梦中才存在的力量。</p><p>我决定去寻找梦中的同伴。说实话我并不知道他们是否真的与我在同一个世界，也不知道他们身在何方，只是隐约有预感，至少陈照是与我一样在b市的。好吧，我承认，在这个梦境后，我愈发相信自己的直觉了。</p><p>新世界</p><p>世界变得无比糟糕，我们曾经赖以生存的能源、科学与技术，似乎都被那个蓝色的太阳燃烧殆尽，燃油电气核反应，这些从工业革命以来长期为这个世界供能的东西，一夜之间失去了它们的所有效能，世界居然可笑地倒退回了农业时代。</p><p>而我们还面临着前所未有的危机。</p><p>“进化”</p><p>得到什么就会相应的失去什么，得到所有就会失去所有，这是公平的交易。</p><p>夜谈</p><p>某个夜晚，白梦找到我，问我害怕吗。</p><p>我望着这个我最初的战友那双比夜色更浓稠的黑眸，卸力般地长叹了一口气。</p><p>我说，我很害怕，我只是个非常糟糕的普通人，这个千变万化的世界已经完全超出我的理解范围和能力范围。</p><p>我问他，这个噩梦什么时候才会结束。</p><p>他没有回答，只是轻轻拥抱了我。</p><p>人形</p><p>那个身影，很熟悉。</p><p>直到高霖雪震惊地喊出声：“白梦？！”我才恍然发觉，是啊，那不就是白梦吗？转头，果然发现本该在封故身边的白梦已经消失不见。</p><p>背叛</p><p>白梦是叛徒？我无法接受这一事实！他是我最初的伙伴和战友，他是我一眼就认定的同类，他是在队伍组建之前第一个帮助我稳定精神的挚友，他怎么会！</p><p>陈照轻轻地拍了拍我的肩膀，告诉我，白梦不是背叛，而是，他从来都只是卧底。他是高级异变体，是非人的存在、诡异的化身、规则的新造物。他，原本就和我们不是一路人。</p><p>白梦对我们很好，在陈照还未能掌握自己的能力前，他甚至一直担任我的精神抚慰者，帮助我掌握能力，他面面俱到、做事周全，宛如一个无比优秀的领导者甚至后勤，他是一个过分完美的队友，我们信任他，依赖他，唯独不会怀疑他。</p><p>我忽然有落泪的冲动，不知道在这个异变的世界中我到底还能相信谁，还能相信谁！</p><p>“白梦……”我低声呢喃，“怎么会……”</p><p>其实仔细想来，他的伪装并不十分完美，我想起前往深渊路上难得一见的安全，想起那些四散而去的诡异，想起他作为治疗系进化者却还拥有不输于陈照的精神力量，想起易无钺在某次占卜后看着我欲言又止的眼神，想起他与高霖雪完全不同的治疗方式；又想起在深渊口挡在我们前面的身影，想起他击杀诡异时的干脆利落，想起他帮助我稳定精神，帮助陈照调理身体，我想起了许多许多，大事小事，危险的温馨的，什么都有，最终又归于他扭曲又畅快的笑容，满身的奇异纹路，和他走入诡异山海的背影。</p><p>陈照拥抱了我，轻声道：“你需要振作起来，还有我们，你还有我们。”</p><p>我看着他，平复心情，缓缓点了点头。</p><p>是的，我总要往前看的，我还有我的队员们，没有了白梦，我们还是要继续战斗下去，直至死亡，又或是被诡异同化。没有了白梦，我更需要承担起作为队长的责任，我必须逼迫自己迅速成长起来，没有人会继续保护我了——或者是，我无法再相信，有人会保护我了。</p><p>其实我只是个很胆怯的人，害怕前进，害怕失去，害怕一切，如果可以，我宁愿窝在家中一辈子不出门，我不想直面那些不可名状的诡异，也没有决策指挥的能力。可是，可是这是我的责任，我的使命，也将成为我毕生的信仰，我必须坚强，必须冲锋，必须果断，必须勇敢，我知道，我也努力在尝试，我所代表的不是我一人，我所背负的是整个世界。这种想法或许太过自大，然而，我依旧如此坚信，似乎有什么东西曾经这样告诉过我。</p><p>神禁</p><p>诡异之海</p><p>危机</p><p>……</p><p>宇宙</p><p>再见</p><p>他说，我是被选中的人。他说，解决问题，要去天上，去苍穹中，去宇宙里。他说，只有我，能在这个异变的世界中，去往苍穹宇宙。</p><p>我看着我的手，只觉得荒诞。</p><p>我注视着白梦，我的战友，我的对手，我的知己，问他：“为什么会是我。”</p><p>他摇了摇头，低声轻笑，什么也没说，只是拥抱了我，像一双轻盈的翅膀。</p><p>“我不会选择逃避，可是……”亦下不了决心去牺牲。</p><p>他看懂了我的未尽之语，却只告诉我：“这只取决于你。去做你想做的事情，不必有任何顾虑。无论如何，都会有人支持你的决定，无关立场，无关敌我。”</p><p>我勉强一笑，不以为意。</p><p>选择</p><p>其实，我并不确定，我是否愿意。这个世界烂透了，毁灭了也不是不行，为什么要牺牲我一人去拯救呢？死我一人，而救苍生；又或者，同归于尽。可是，我有什么资格决定这个星球的存亡？可是，我有什么罪过让这个星球决定我的存亡？若是全人类都知道了这一结果，都知道只要牺牲我一人，便可以让世界回归正轨，那我的结局，岂不是早已注定？可是，他们又有什么权力决定我的生命如何凋谢？</p><p>是，我是认为生死于我，本无区别；然而，这是我自己选择的，况且，我更加觉得，旁人的生死，更是无关紧要。我在这个异变的世界里挣扎这么久，只是为了我自己，为了自己活下去，而不是等待一个牺牲去拯救其他人！</p><p>可是，这个星球上，也不只有人类啊。我厌恶的，喜爱的，憧憬的，摒弃的，渴望的，忽视的，都承载在这一小小的星球上。我感受着体内熟悉的力量，这个异变的世界让人类“进化”出了如此多样的特异能力，为什么偏偏只有我拥有了飞行之力？飞，在异变之前只是个多么微不足道的能力，不说鸟类，便是人类也可以借助各类工具实现飞天，不仅是天空，还有宇宙。然而异变后，天空成为了生灵的禁区，唯有我，保留了一扇前往禁地的门扉，一把打开封锁的“银之匙”。</p><p>白梦说，命运的答案在苍穹中。这句话是可信的吗？毕竟，他是诡异。</p><p>不过我愿意去相信，只因我相信白梦，一如从前，无关敌我。</p><p>我并不急于做出选择。</p><p>……再让我思考一下吧，在我最后的时间里。</p><p>“天神”</p><p>所谓结局，是可以被预见的。数学家说这是概论的游戏，量子物理认为这是既定的轨道。我不明白这些原理，但也能看到我的结局。</p><p>人群簇拥着我，注视着我，呼喊着我，此时，结局不是已经注定？</p><p>或者在更久之前，我第一次误入那个被我认为是梦境的世界夹缝时，就已经注定。</p><p>又或者在最初诞生的那一刻，那些神奇的量子就已模拟完一切，只等我们走上那条无法回头的单行道。彼时彼刻彼处我出生，此时此刻此处我抉择。</p><p>我最后一次望向了天边翻涌的诡异，毫不留恋地腾空而起，为我的梦画下最后一笔。</p><p>终章</p><p>我终于看到了这个宇宙的中心，异变的源头。</p><p>无数诡异又澄澈的波纹荡漾，星球安静地沿着轨道运行，看不到的丝线缠绕着每个生灵，一切似乎平静又安宁。</p><p>我看到了那个不起眼的蓝色星球，和笼罩着它的虹色光幕。我好像看到了我的队友，我的家人，我遇见过的所有人和未曾见过的所有人，他们抬头望着我，紧张而又期待；又好像什么都没看见，万千泡影，只觉大梦一场。</p><p>我从来都不觉得自己是特殊的，然而，事实总爱让人大跌眼镜，平凡如我最后却真的成为了那个被“选中”的人。可如果这是世界赋予我的使命，那我也不会胆怯地不敢去承担；或者说，平凡如我，若是最终能干一番惊骇的大事业，大约是我的幸运吧。我虽然也做拯救世界的白日梦，却想不到我真的能有机会成为“救世主”，人生果然像一幕反转不断的大戏，又像一场天马行空的梦境——又或许，这本就是一场梦，一如开始，一如结局。</p><p>——无论如何，我已经站在了这里。</p><p>无端地，我想起了白梦曾经问我的一个问题，他说，你害怕吗。当时我回答，害怕。如今我依旧回答，害怕。我又想起那个解梦师，这次，我听见了她最后轻声对我说的话，她说，未来，在我手上，在我心中。我望着自己的手，它握着这个星球的生死，或者是，只是我的命运。</p><p>人类对一些东西的恐惧是刻入基因的，可是，人是可以对抗基因的生灵，恐惧可以被克服，欲望可以被战胜，生命本身才是最强大的力量。人生有太多无奈和纠结，不如就这样，勇敢地去对抗；无论成败生死，还是过去未来。</p><p>我稳住身形，平复精神，迈出了最后一步。</p><p>那些本来缠绕着生灵的丝线渐渐束缚住我，我感受到梦中世界与我慢慢融合，感受到梦中世界缓缓与现实分离，感受到无穷无尽的力量涌入我的身体，又倏尔全部散去，我渐渐感受不到自己的身体，而意识随之四散，在闭眼前的最后一瞬，我看到了一滴水珠，一滴反射着宇宙光辉的水珠——不，那不是水珠，那是一滴泪。</p><p>是世界的眼泪，是白梦的眼泪，是所有我见过或没见过的人的眼泪，是……我的眼泪。</p><p>一切归于沉寂。</p><p>后日谈</p><p>“叮铃铃！叮铃铃！”我被闹钟吵醒，翻身按灭手机，感到头痛欲裂，似乎做了一个很长很长的梦，翻出备忘录想要记录梦境的内容，苦思冥想却什么都记不起来，我讪讪地关上手机，不情不愿地从床上咕涌起来，下床，洗漱，匆匆拎上书包跑向教学楼，还忘记了带上宿舍钥匙和校园卡。哎，不管了，早八要迟到了。</p><p>走出宿舍楼的时候，太阳初升，天边泛着幽幽的蓝光。我抬首望日，没有看到蓝日下我的皮肤上一闪而过的诡异纹路，丝丝缕缕蔓延在全身，最后隐于背脊处。</p><p>新的一天，开始了。</p><p></p>"}, {"id": "w3", "title": "宿舍怪谈", "type": "小说", "series": "往暮色深处", "excerpt": "宿舍怪谈 您好，欢迎入住北京大学34a宿舍，为了您今后的宿舍生活愉快安全，我们为您准备了一份须知，希望您可以遵守。我们宿舍楼每年的存活率高达百分之九十五，之所以能有这么高的比例，全赖这份须知，这是我们总结了无数个失败教训后得出的、能保证您安全的守则。不然，您不会想要知道后果的。", "body": "<p>宿舍怪谈</p><p>您好，欢迎入住北京大学34a宿舍，为了您今后的宿舍生活愉快安全，我们为您准备了一份须知，希望您可以遵守。我们宿舍楼每年的存活率高达百分之九十五，之所以能有这么高的比例，全赖这份须知，这是我们总结了无数个失败教训后得出的、能保证您安全的守则。不然，您不会想要知道后果的。</p><p>1 宿舍楼开放时间是早上六点到晚上十一点，请尽量在这一时间段进出宿舍楼，太早和太晚都是不被允许的。进出请尽量保持安静！祂们不喜欢有人打扰祂们休息。（安静！安静！安静！有趣！有趣！有趣！）</p><p>2 如果您确实有急事必须在六点前或十一点后进出，请务必不要发出任何声音！记住，是任何！说实话，我并不建议您十一点外出后还回来，在外面待到第二天六点之后是个很不错的选择，毕竟，也许外面才是安全的呢（笑）。（滋滋滋）……（不许离开我！！！）</p><p>3 我们为每位入住人员都配备了钥匙，请千万保管好，出门时也请带上钥匙！如果您忘记了，可以去一楼宿管处问宿管阿姨借钥匙，但请务必在五分钟内归还！之后，我们并不能保证宿管手中钥匙的安全。</p><p>4 宿管是可以相信的，但请记住，我们为宿管提供的衣服是蓝色的，如果您见到了穿红色衣服的宿管，请假装没有看见祂。如果祂向您打招呼了，请一定要礼貌回复祂，但，请不要看祂的脸，您不会想看到这么一张脸的。（为什么不看我！为什么不看我！为什么不看我！）</p><p>5 室友是您最可以信任的对象，请相信室友的每一句话，也不要对室友说谎，她们是您在宿舍里最亲密的人。室友会带钥匙出门，如果她不是自己开门而是敲门说忘带钥匙，请不要相信祂！请不要相…（滋滋滋）（滋滋滋）（您当然可以相信我，我可是您最亲爱的室友啊）</p><p>6 宿舍会在早上七点到九点和下午三点到十点五十分供应热水，请在这一时间段前去浴室洗澡。洗澡对您是有好处的，我们会为您提供最舒适的洗澡水温度。请至少每周洗一次澡！祂很喜欢邋遢的人，但是我想，您不会希望祂喜欢您的，就算您多么希望有一段恋情。（滋滋滋）（……和我在一起，难道不好吗？）请不要在其他时段去洗澡，一个冷水澡可能会使您生病，这是很不好的体验。（……那真的是水吗？）（粘稠的…红色的……水？）（笑）</p><p>7 34a有独立的卫生间，您可以很方便地解决您的需求，但是请一直打开通风扇，相信我，空气向外流通才是正确的。不然，您也不会喜欢宿舍有奇怪的味道。（嘻嘻嘻，我可以从这里进来吗？嘻嘻嘻）</p><p>卫生间是安全的，您可以自由使用。但是说实话，我并不建议您在里面待太久，让其他人等待可不是什么好习惯。（…我会一直等着您…）</p><p>8 宿舍楼会在晚上十一点统一熄灯，如果十一点还没有熄灯，我认为您最好主动去关灯，相信我吧，您不会想要被发现的。</p><p>9 十一点后可以使用台灯，但是不能打扰到您的室友，也最好不要发出声音，您亲爱的室友可能会需要一个没有打扰的睡眠。（其实我并不介意。）（不要相信他！不要相信祂！）（滋滋滋）灯光是……危……（滋滋滋）灯光是安全的，亲爱的。</p><p>10 十二点后，如无特殊情况，请尽量关灯上床。我知道您希望多学一会，但是亲爱的，还是要保证充足的睡眠。（陪我来玩陪我来玩陪我来玩！）毕竟，宿舍就是用来休息的地方，不是吗？（闭嘴！）</p><p>11 一般来说，十一点后，过道上是不会有任何声音的。如果您听到了声音，请忽视，请忽视，请忽视！您可能是太累了出现了幻觉，快休息吧。（滋滋滋）（……看看我嘛～看看我！我恨你！我恨你！我恨你！）</p><p>12 如果十一点后听见了敲门声，请立刻关闭所有光源！请不要发出任何声音！请保持您正常的呼吸和心跳！我想，祂也不会打扰一个睡觉的人。（……您真的睡了吗！？）</p><p>13 白天的宿舍楼是相对安全的（滋滋滋）（安全？真的安全吗？什么是安全？我才是最安全的！我爱您！我爱您！我爱您！）您可以自由地做您想做的事情。除非，您的室友还在睡梦中，请不要打扰祂，让她（？好好休息。（笑）（…祂真的，是您的室友吗？真的是吗？您觉得呢？）</p><p>14 您可以去串门，多认识您的“邻居”们对你没有坏处。但是请记住，请先敲门，说明您的来意，她们会在您敲门后才开门。别人的宿舍门不会特意为您打开，希望您不会自作多情。（您来啦…滋滋滋…看看我……）但是十一点后就不必了，大家都需要休息。您不会希望打扰到祂的。（为什么阻止我！）</p><p>15 原则上，我们不允许非本楼人员进入本楼。所以请您也千万不要带其他人进来，这是规矩，希望您不会违反。我们不会保护非本楼人员在本楼活动的安全，您应该也不想失去您的朋友。（都来陪我吧～～嘻嘻嘻嘻）</p><p>16 宿舍楼提供开水，若您需要矿泉水，可订购，会有专门人员为您送水，他们是安全的（没有谁是安全的！没有！您又骗我！）。但请记住，水是透明无色的，若您见到了其他颜色的液体，千万不要将它拿进宿舍。（滋滋滋）（这很美味，您可以尝尝，这是我为您特意准备的！相信我，好吗？相信我！）</p><p>17 由于本楼建造年代较为久远，故为您提供的桌椅床柜等家具难免会出现一些故障，您可以拨打报修电话，会有人员上门为您修理。但请记住，他们会礼貌敲门，而不会直接用钥匙开门。另外，我建议您时刻关注他们的行为，您只需要修理您的器具，不是吗？</p><p>18 最后，我想要提醒您，请千万爱护宿舍的公共区域和公共器具，这是作为入住者的基本素养。不然，您不会想知道后果的。（是谁！是谁！是谁！好痛！好痛！好痛！杀了她，杀了她，杀了她！）</p><p>好了，我想这些是最重要的规则，遵守它吧，这很简单，不是吗？我想，您会获得一个快乐又安全的宿舍生活的。</p><p>祝您好运。</p>"}, {"id": "w4", "title": "天幕在咫尺", "type": "散文", "series": "世界的一瞬", "excerpt": "星空与土地 我经常在路上走着走着就会忽然停下来，或者放慢步调，甚至往回退走；因为我经常会抬头看，美丽的天空。有时是蓝天白云，有时灰蒙蒙一片，偶尔有飞机或者不知名的飞鸟掠过天空。", "body": "<p>星空与土地</p><p>我经常在路上走着走着就会忽然停下来，或者放慢步调，甚至往回退走；因为我经常会抬头看，美丽的天空。有时是蓝天白云，有时灰蒙蒙一片，偶尔有飞机或者不知名的飞鸟掠过天空。</p><p>但给我带来更多思考的往往是夜晚黑沉沉的天。</p><p>光污染严重的北京的夜晚向来是看不见几颗星星的——当然还是能经常看见那么几颗。然而某天深夜我从东门走回宿舍，在五四附近抬头，却隐隐约约窥见一片璀璨的星空。我欲拍照时呢，手机镜头却又不如我的眼睛那样敏锐了，无论怎么找角度都只能记录下路灯昏黄却刺眼的光。</p><p>明明，路灯的光怎可与星辰争辉，但是谁让它近在身旁，就能凭借“暗淡”的人造灯光遮挡住数亿光年外星辰想要落入我眸中的灿烂星芒。</p><p>——谁让我在路灯下呢？</p><p>路灯与星辰，我觉得，确实是很奇妙的一对。仔细去想的话，它们好像能够比做成无数奇奇怪怪的东西。离一个东西越近，越看不清楚其他的风景。</p><p>然而我们就是离地表的人造物品更近，更能感受到它们的光。星空很美很壮丽很震撼，可是它实在太远太远了；我所能真实触碰的，只是脚下的土地。我能仰望它，却不能在上面漫步。我可以驻足、欣赏、赞叹、景仰、憧憬，却不会也不能进入。</p><p>或许，遥远的幻想还是不能给予我安全感。只有孕育我的泥土，才能让我安眠。</p><p>可是这对我好像又是一个悖论。我正在做或者说将要做的事情确实是接近甚至亲身触摸土地的，可是它的最终目的又感觉是那么虚无缥缈像是要去天幕摘一颗星星。所有它好像也很难让我有比较浓烈的安全感。</p><p>也许文明本就是天上星辰，考古人也的确是摘星人。</p><p>那个摘星人，或许是你，但，可能会是我吗？</p>"}, {"id": "w5", "title": "文明的时空", "type": "散文", "series": "世界的一瞬", "excerpt": "时间与空间真是巧妙的组合，当我们仰望星空，看到浩瀚的宇宙，那些一闪一闪的星星，仿佛恒久不变地镶嵌在天幕中。然而，现代科学告诉我们，光年是距离单位，宇宙深处星星点点射向我们的光线，来自遥远的过去。原来，时空的穿越，不过是俯仰之间。       ——刘斌 俯仰之间", "body": "<p>时间与空间真是巧妙的组合，当我们仰望星空，看到浩瀚的宇宙，那些一闪一闪的星星，仿佛恒久不变地镶嵌在天幕中。然而，现代科学告诉我们，光年是距离单位，宇宙深处星星点点射向我们的光线，来自遥远的过去。原来，时空的穿越，不过是俯仰之间。       ——刘斌</p><p>俯仰之间</p><p>曾经我坚定相信已成云烟的“历史”的重要性不亚于等待开创的未来。我曾“赞叹于历史长河浩荡奔涌的波澜壮阔，钦慕于先哲问辨宇宙人生的执着深邃”，豪言“在向前的社会往后看，守护文明剪影”，自称“浪漫的现实主义者”，以为自己“停滞而奔涌”。</p><p>如今再看，确实只是中二时期不谙世事又自视过高的狂妄想法。</p><p>后来又在一次次莫名其妙的观念冲击下忽然对曾经的自己、对曾经的选择产生了强烈的质疑和不解，以至于对整个人文学科的价值都产生了极大的怀疑，甚至开始渐渐理解并赞同知乎上关于“文科无用”的说法——而我曾经坚定并激烈地反驳他们。</p><p>当然人文学科的作用并轮不到我去质疑，我所怀疑，也仅仅是，“我”这个个体来读人文、搞形而上的东西的意义。</p><p>原本我其实以为“意义”这个东西并不重要，因为世界上绝大多数的事情尤其是绝大多数普通人做的事情都不见得有多大意义。对于“世界”来说，我们本就是多余的，所以，只要存在有原因，有价值，有意义。不然，“存在”就只是浪费资源的无用事情；而我相信自然远比人类懂得“适者生存”和“节约资源”和“效率最大化”。</p><p>可是在短短三个月的时间内，我居然开始怀疑。</p><p>可是这短短三个月，对我来说好像真的有三年那么长。十八年没有改变的想法，居然只需要三个月就可以。</p><p>然而再仔细想，这种可怕的想法不过是我走入了另一个极端，只是因为我开始思考现实的利益，开始感到货真价实的焦虑，开始陷入情绪的低谷。</p><p>原来单纯幼稚的理想主义想法或许才是对我来说最正确的想法。哪有那么多的“意义”可以去追寻，“价值”从来都不是一个能够轻易比较的东西。过去的历史确实就算复原也不见得能够像前沿科学的突破那样直接派上什么用场，但是谁说精神的意义不是意义呢？我虽然不解我们的文化自信为何那么依赖所谓“五千年文明”，但人类所研究的所有东西最终都不是为了使人过上更舒适的生活吗？我国什么都争一个正向的第一，那么五千年或许还不够，那么六千、八千、一万年呢？</p><p>而这时空大门的开启与时空旅途的探索，不是就正等着我嘛！</p><p>当然，过去的历史在某种程度上也可以说是既定事实，我并不能按照自己的心意将之随意“篡改”。但是现实之上，人类还有无穷尽的想象力，尤其对于我这种做不出什么实事的中二病晚期患者来说，恢弘的白日梦永远是不可或缺的；纵然现实可能糟糕成一团乱麻只能将自己一顿臭骂，但依旧会有并且需要有肆意的幻想给予一点点虚无的安慰——否则我这可怜的生活还不得成一潭死水？</p><p>幻想再瑰丽也不会变成现实。就像我会想象文明的一万种起源，甚至会开玩笑说“人类起源于诸暨”，但事实既定，历史已成诗，只是或许暂时缺乏证据罢了。</p>"}, {"id": "w6", "title": "四维宇宙的尘埃也是时间的旅者", "type": "诗歌", "series": "世界的一瞬", "excerpt": "时间 人们最害怕的是什么", "body": "<p>时间</p><p>人们最害怕的是什么</p><p>最无法挽留</p><p>最无能为力</p><p>最</p><p>最想要掌控却永远无法</p><p>是什么</p><p>是强大的时间洪流</p><p>是无情的时间旅者</p><p>你我</p><p>想要穿梭过去与未来</p><p>你我</p><p>想要改变遗憾的一切</p><p>你我</p><p>站在长河两端</p><p>默默相望</p><p>时间之神</p><p>可你我只是生活在三维的宇宙</p><p>看不清所谓世界与时间的真相</p><p>过好普通的生活已经竭尽全力</p><p>如何去探索过去和虚妄的未来</p><p>是的</p><p>虚妄</p><p>未来确是虚妄</p><p>无法穿梭时间的行人</p><p>无法看到未来的真相</p><p>迷雾</p><p>我看到迷雾</p><p>重重的雾</p><p>时间</p><p>我愿成为</p><p>四维宇宙的尘埃</p>"}, {"id": "w7", "title": "谁说你能在梦中死去", "type": "诗歌", "series": "世界的一瞬", "excerpt": "死 谁说你能在梦中死去", "body": "<p>死</p><p>谁说你能在梦中死去</p><p>梦</p><p>梦是谎言</p><p>是最美的泡沫</p><p>在梦中</p><p>有你得不到的一切</p><p>死亡</p><p>是你无法得到</p><p>是你如此渴望</p><p>在梦中死亡</p><p>死亡</p><p>最浪漫的离开</p><p>悄悄地</p><p>悄悄地告别世界</p><p>毫无痛苦的</p><p>漫不经心的</p><p>梦寐以求辗转反侧</p><p>死神</p><p>而死神</p><p>死神不会入梦</p><p>你能在梦中死亡</p><p>或许</p><p>可是</p><p>你丢了梦</p><p>你不死亡</p><p>生</p><p>你害怕的</p><p>世人害怕的</p><p>才会永远存在</p><p>谁说</p><p>你能在梦中死亡</p>"}];const grid=document.getElementById('grid'),count=document.getElementById('count'),modal=document.getElementById('modal');function render(type='全部'){const list=type==='全部'?works:works.filter(w=>w.type===type);count.textContent=list.length;grid.innerHTML=list.map(w=>`<article class="card" data-id="${w.id}"><div class="tag">${w.type}</div><h3>${w.title}</h3><p>${w.excerpt}</p><div class="series">${w.series}</div></article>`).join('')||'<div class="empty">这一类作品正在整理中。</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>open(c.dataset.id))}function open(id){const w=works.find(x=>x.id===id);if(w.url){location.href=w.url;return;}rType.textContent=w.type;rTitle.textContent=w.title;rMeta.textContent=w.series;rBody.innerHTML=w.body;modal.classList.add('open');document.body.style.overflow='hidden'}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.type)});close.onclick=()=>{modal.classList.remove('open');document.body.style.overflow=''};modal.onclick=e=>{if(e.target===modal)close.onclick()};render();</script></body></html>
